name: bulla

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coherence-check:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install bulla from source
        run: pip install -e .

      - name: Run bulla on bundled examples (smoke — demos carry blind spots by design)
        run: |
          bulla check --max-blind-spots 5 --format sarif compositions/ > bulla.sarif 2>/dev/null || true
          test -s bulla.sarif && echo "bulla ran and produced SARIF ($(wc -c < bulla.sarif) bytes) ✓"

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3
        with:
          sarif_file: bulla.sarif
        continue-on-error: true

  semver-smoke:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: SemVer action smoke (allow mode)
        id: semver_allow
        uses: ./
        with:
          mode: semver
          old-path: compositions/auth_pipeline.yaml
          new-path: compositions/financial_pipeline.yaml
          upload-sarif: true

      - name: Validate semver outputs
        run: |
          test -n "${{ steps.semver_allow.outputs.delta-r }}"
          test -n "${{ steps.semver_allow.outputs.update-kind }}"
          test -n "${{ steps.semver_allow.outputs.coherence-preserving }}"
          test -n "${{ steps.semver_allow.outputs.old-fee }}"
          test -n "${{ steps.semver_allow.outputs.new-fee }}"
          test -n "${{ steps.semver_allow.outputs.minimum-bridge-delta }}"

      - name: SemVer policy gate blocks major
        id: semver_block
        continue-on-error: true
        uses: ./
        with:
          mode: semver
          old-path: compositions/auth_pipeline.yaml
          new-path: compositions/financial_pipeline.yaml
          fail-on-major: true
          upload-sarif: false

      - name: Assert policy gate failure occurred
        run: test "${{ steps.semver_block.outcome }}" = "failure"

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[ots,identity]"
          pip install pytest

      - name: Run standalone repository tests
        shell: bash
        run: |
          python scripts/verify_distribution_policy.py --print-standalone-tests \
            > "$RUNNER_TEMP/standalone-tests.txt"
          mapfile -t standalone_tests < "$RUNNER_TEMP/standalone-tests.txt"
          test "${#standalone_tests[@]}" -gt 0
          python -m pytest "${standalone_tests[@]}" -v

      - name: Check release slots for omission
        run: >-
          python scripts/check_release_slots.py
          --slots-dir releases/slots
          --receipts-dir releases
          --context releases/release-trust-context.json
