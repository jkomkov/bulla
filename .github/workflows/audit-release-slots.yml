name: audit public release slots

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the public receipt verifier
        run: python -m pip install ".[identity]"
      - name: Retrieve public slots and closing receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public-release-records/slots public-release-records/receipts
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --paginate \
            --slurp \
            > "$RUNNER_TEMP/releases.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          request = Request(
              "https://pypi.org/pypi/bulla/json",
              headers={
                  "Accept": "application/json",
                  "User-Agent": "bulla-release-slot-audit/0.44",
              },
          )
          with urlopen(request, timeout=30) as response:
              document = json.load(response)
          Path(os.environ["RUNNER_TEMP"], "pypi-project.json").write_text(
              json.dumps(document)
          )
          PY
          git fetch --force --tags origin
          git tag --list 'release-slot-v*' > "$RUNNER_TEMP/slot-tag-refs.txt"
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("scripts").resolve()))
          from check_release_slots import validate_release_inventory

          root = Path(os.environ["RUNNER_TEMP"])
          pages = json.loads((root / "releases.json").read_text())
          releases = [item for page in pages for item in page]
          slot_refs = {
              tag
              for tag in (root / "slot-tag-refs.txt").read_text().splitlines()
              if tag
          }
          controls = json.loads(
              Path("releases/release-repository-controls.json").read_text()
          )
          pypi = json.loads((root / "pypi-project.json").read_text())
          result = validate_release_inventory(
              releases,
              pypi,
              slot_refs,
              epoch=controls["slot_enforcement_epoch"],
          )
          (root / "slot-tags.txt").write_text(
              "".join(f"{tag}\n" for tag in result["slot_tags"])
          )
          (root / "public-tags.txt").write_text(
              "".join(f"{tag}\n" for tag in result["public_tags"])
          )
          PY
          while IFS= read -r slot_tag; do
            test -n "$slot_tag" || continue
            version="${slot_tag#release-slot-v}"
            gh release download "$slot_tag" \
              --pattern "$version.slot.json" \
              --dir public-release-records/slots
            gh release verify "$slot_tag"
            if grep -Fx "v$version" "$RUNNER_TEMP/public-tags.txt" >/dev/null; then
              gh release verify "v$version"
              gh release download "v$version" \
                --pattern "$version.json" \
                --dir public-release-records/receipts || true
            fi
          done < "$RUNNER_TEMP/slot-tags.txt"
      - name: Fail on an invalid or overdue unclosed slot
        run: |
          python scripts/check_release_slots.py \
            --slots-dir public-release-records/slots \
            --receipts-dir public-release-records/receipts \
            --context releases/release-trust-context.json \
            --enforcement-epoch "$(
              python -c 'import json; print(json.load(open("releases/release-repository-controls.json"))["slot_enforcement_epoch"])'
            )" \
            --git-repository .
